
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule meetings</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        <div class="slots-wrapper" id="slotsContainer">
            </div>

        <div id="bookingModal" class="modal">
            <div class="modal-content">
                <p><strong>Name:</strong></p>
                <input type="text" id="nameInput">

                <p><strong>Email:</strong></p>
                <input type="email" id="emailInput">
<!-- 
                <input type="text" id="linkInput" placeholder="Enter meeting link"> -->

                <br><br>

                <button id="bookBtn">Book</button>
            </div>
        </div>

        <div class="meetings-section">
            <h2>Scheduled meetings</h2>
            <!-- <div id="meetingContainer"></div> -->
            <hr>
            <div id="meetingList" class="meeting-grid">
                </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
